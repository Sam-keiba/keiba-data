[project]
name = "keiba-data"
version = "0.1.0"
description = "JRA公式・netkeibaからのレースデータ取得とSQLiteへの保存（keibaプロジェクトのデータ基盤層）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "requests>=2.34.2",
]

[project.scripts]
keiba-data = "keiba_data.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
